{% extends "main/layout.html" %}
{% block title %}
    <a>Добавить запись</a>
{%endblock%}
{% block content %}
    <div class="features">
        <h1>Добавить запись</h1>
        <form method="post", enctype="multipart/form-data">
            {% csrf_token %}
            {{form.title}}<br>
            {{form.anons}}<br>
            {{form.full_text}}<br>
            {{form.picture}}<br>
            {{form.date}}<br>
            <button class="btn btn-success" type="submit">Добавить запись</button>
        </form>
    </div>
{% endblock %}
